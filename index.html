<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BHC Nampo Team Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#161616;
    --ink-2:#212121;
    --ink-3:#2A2A2A;
    --paper:#F2F1EC;
    --text:#A6A6A6;
    --flame:#F2C230;
    --flame-dark:#D9A80D;
    --herb:#8FA26B;
    --ember:#E06A52;
    --text-dim:#C7C7C7;
    --line: rgba(255,255,255,0.14);
    --radius: 3px;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--ink); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  h1,h2,h3{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 32px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:16px; }
  .brand h1{ font-size:22px; }
  .brand span.sub{ color:var(--text-dim); font-size:13px; }
  nav.tabs{ display:flex; gap:6px; background:var(--ink-2); padding:5px; border-radius:999px; }
  nav.tabs button{ border:none; background:transparent; color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:600; font-size:14px; padding:10px 20px; border-radius:999px; cursor:pointer; }
  nav.tabs button.active{ background:var(--flame); color:var(--ink); }
  main{ max-width:1080px; margin:0 auto; padding:36px 24px 90px; }
  .intro{ margin-bottom:28px; max-width:600px; }
  .intro p{ color:var(--text-dim); line-height:1.6; font-size:15px; }
  .field{ margin-bottom:20px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--text-dim); margin-bottom:7px; }
  .field input[type=text], .field input[type=password], .field input[type=date], .field textarea{
    width:100%; padding:12px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--ink-2); color:var(--text); font-family:'Inter',sans-serif; font-size:15px;
  }
  .field input:focus, .field textarea:focus, button:focus-visible, select:focus-visible{ outline:2px solid var(--flame); outline-offset:2px; }
  .field textarea{ min-height:80px; resize:vertical; }
  .hint{ font-size:12.5px; color:var(--text-dim); margin-top:6px; }
  .error-msg{ color:var(--ember); font-size:13.5px; margin-top:8px; font-weight:600; }
  .success-msg{ background:var(--herb); color:var(--ink); padding:14px 16px; border-radius:var(--radius); font-weight:600; margin-top:18px; font-size:14.5px; }
  .rail{ display:flex; gap:14px; overflow-x:auto; padding:6px 2px 16px; margin-bottom:6px; }
  .ticket{ flex:0 0 132px; background:var(--paper); color:var(--ink); border-radius:var(--radius); padding:14px 12px 12px; position:relative; }
  .ticket::after{ content:""; position:absolute; left:10px; right:10px; top:56px; border-top:1.5px dashed rgba(0,0,0,0.25); }
  .ticket .dname{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; }
  .ticket .ddate{ font-size:12px; color:#666666; margin-top:2px; margin-bottom:20px; }
  .shift-btn{ width:100%; text-align:left; display:block; border:1px solid rgba(0,0,0,0.2); background:transparent; color:var(--ink); font-family:'Inter',sans-serif; font-size:13px; font-weight:600; padding:8px 10px; border-radius:var(--radius); cursor:pointer; margin-top:7px; }
  .shift-btn .dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:7px; border:1.5px solid #666666; vertical-align:middle; }
  .shift-btn.active{ background:var(--ink); color:var(--text); border-color:var(--ink); }
  .shift-btn.active .dot{ background:var(--flame); border-color:var(--flame); }
  .btn{ display:inline-block; border:none; cursor:pointer; font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; padding:13px 26px; border-radius:999px; background:var(--flame); color:var(--ink); }
  .btn:hover{ background:var(--flame-dark); }
  .btn.secondary{ background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.secondary:hover{ border-color:var(--flame); color:var(--flame); }
  .btn.danger{ background:var(--ember); color:var(--text); }
  .btn.danger:hover{ background:#9C3E2C; }
  .btn.small{ padding:8px 16px; font-size:13px; }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .login-card{ max-width:360px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:30px 28px; }
  .subnav{ display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap; }
  .subnav button{ border:1px solid var(--line); background:transparent; color:var(--text-dim); font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; padding:9px 16px; border-radius:999px; cursor:pointer; }
  .subnav button.active{ background:var(--paper); color:var(--ink); border-color:var(--paper); }
  .card{ background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:20px; }
  select{ padding:11px 14px; border-radius:var(--radius); border:1px solid var(--line); background:var(--ink-2); color:var(--text); font-family:'Inter',sans-serif; font-size:14.5px; width:100%; max-width:100%; }
  table.board{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:16px; }
  table.board th, table.board td{ border:1px solid var(--line); padding:9px 10px; text-align:left; vertical-align:top; }
  table.board th{ background:var(--ink-3); color:var(--text-dim); font-weight:600; }
  table.board td.center{ text-align:center; }
  .tick-yes{ color:var(--herb); font-weight:700; }
  .tick-no{ color:var(--text-dim); }
  .staff-tag{ display:inline-block; background:var(--paper); color:var(--ink); font-size:12px; font-weight:600; padding:3px 8px; border-radius:999px; margin:2px 4px 2px 0; }
  .empty-note{ color:var(--text-dim); font-size:14px; padding:20px 0; }
  .archive-item{ display:flex; align-items:center; justify-content:space-between; gap:14px; background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:12px; flex-wrap:wrap; }
  .archive-item .meta strong{ font-family:'Fraunces',serif; font-size:16px; font-weight:600; }
  .archive-item .meta div{ color:var(--text-dim); font-size:12.5px; margin-top:3px; }
  .archive-item .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .logout-link{ background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; text-decoration:underline; }
  .row-between{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:10px; }
  .confirm-box{ background:var(--ink-3); border:1px solid var(--ember); border-radius:var(--radius); padding:14px 16px; margin-top:14px; }
  .confirm-box p{ margin:0 0 12px; font-size:14px; }
  .busy-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .busy-row:last-child{ border-bottom:none; }
  .inline-form{ display:flex; gap:10px; align-items:end; flex-wrap:wrap; margin-top:14px; }
  .inline-form .field{ margin-bottom:0; min-width:150px; }
  .day-editor-card{ background:var(--ink-3); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:14px; }
  .shift-block{ margin-bottom:12px; }
  .shift-label{ font-size:12px; font-weight:700; color:var(--text-dim); margin-bottom:8px; }
  .shortage{ color:var(--ember); font-weight:700; font-size:12px; margin-top:4px; }
  .chip{ display:inline-flex; align-items:center; gap:6px; background:var(--paper); color:var(--ink); font-size:12px; font-weight:600; padding:5px 6px 5px 10px; border-radius:999px; margin:3px 5px 3px 0; }
  .chip select.role-select{ border:none; background:transparent; font-size:11px; font-weight:700; color:var(--ink); width:auto; max-width:120px; padding:0; }
  .open-tag{ font-size:10px; font-weight:700; color:var(--flame-dark); }
  .chip button.chip-x{ border:none; background:rgba(0,0,0,0.15); color:var(--ink); width:18px; height:18px; border-radius:50%; cursor:pointer; font-size:11px; line-height:1; flex-shrink:0; }
  .add-row{ display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; }
  .add-row select{ flex:1 1 180px; width:auto; min-width:140px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,minmax(120px,1fr)); gap:1px; background:var(--line); min-width:840px; }
  .cal-head{ background:var(--ink-3); color:var(--text-dim); font-weight:700; font-size:12.5px; padding:8px; text-align:center; }
  .cal-cell{ background:var(--ink-2); min-height:96px; padding:8px; font-size:11.5px; }
  .cal-cell.cal-out{ background:var(--ink); color:var(--text-dim); opacity:0.55; }
  .cal-cell.cal-today{ outline:2px solid var(--flame); outline-offset:-2px; background:var(--ink-3); }
  .cal-datehead{ display:flex; align-items:center; justify-content:space-between; font-weight:700; font-size:13px; margin-bottom:6px; gap:4px; }
  .cal-busy{ font-weight:700; font-size:10px; color:var(--flame); white-space:nowrap; }
  .cal-shift{ line-height:1.5; margin-bottom:4px; }
  .cal-shift-label{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; padding:1px 5px; border-radius:999px; margin-right:4px; }
  .cal-label-day{ background:var(--flame); color:var(--ink); }
  .cal-label-night{ background:var(--ink); color:var(--text); border:1px solid var(--line); }
  @media (max-width:640px){
    body{ overflow-x:hidden; }
    .topbar{ padding:16px; gap:12px; } main{ padding:22px 14px 70px; }
    nav.tabs{ width:100%; } nav.tabs button{ flex:1; text-align:center; padding:10px 6px; font-size:13px; }
    .subnav{ flex-direction:column; }
    .subnav button{ width:100%; text-align:center; white-space:normal; }
    .card{ padding:16px; }
    .field[style*="max-width"]{ max-width:100% !important; }
    .inline-form{ flex-direction:column; align-items:stretch; }
    .inline-form .field{ width:100%; min-width:0; }
    .row-between{ align-items:stretch; }
    .add-row{ flex-direction:column; align-items:stretch; }
    .add-row select{ width:100%; }
    .add-row .btn{ width:100%; }
    table.board{ font-size:12px; }
    table.board th, table.board td{ padding:6px 7px; }
    .staff-tag, .chip{ font-size:11px; }
    .archive-item{ flex-direction:column; align-items:stretch; }
    .archive-item .actions{ width:100%; }
    .archive-item .actions .btn{ flex:1; }
    .busy-row{ flex-direction:column; align-items:flex-start; gap:8px; }
    .busy-row .btn{ width:100%; }
    .day-editor-card{ padding:14px; }
    .rail{ -webkit-overflow-scrolling:touch; }
    table.board, .card > div[style*="overflow-x"]{ -webkit-overflow-scrolling:touch; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1>BHC Nampo</h1>
    <span class="sub">Team Scheduler</span>
  </div>
  <nav class="tabs">
    <button id="tab-staff" class="active">Fill Availability</button>
    <button id="tab-view">View Schedule</button>
    <button id="tab-admin">Create Schedule</button>
  </nav>
</div>

<main>
  <div id="page-staff"></div>
  <div id="page-view" style="display:none;"></div>
  <div id="page-admin" style="display:none;"></div>
</main>

<script>
/* ============================================================
   STORAGE
   Priority:
   1) window.storage — provided automatically inside the Claude
      artifact preview.
   2) Firebase Firestore — a free shared database, used once you
      fill in FIREBASE_CONFIG below. This is what makes data
      visible across different staff phones and the admin's own
      device once published (e.g. on GitHub Pages).
   3) localStorage — safety-net fallback if Firebase isn't
      configured. Only visible on that one device/browser.
============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCu4GhPJvu8ppZBRKyHZfmkIKhrmDIaEyI",
  authDomain: "scheo-8aaae.firebaseapp.com",
  projectId: "scheo-8aaae",
  storageBucket: "scheo-8aaae.firebasestorage.app",
  messagingSenderId: "580762931249",
  appId: "1:580762931249:web:d1791071d8c100045a0510"
};
const FIRESTORE_COLLECTION = "bhc_nampo_data";

if(!window.storage){
  let firestoreDb = null;
  const firebaseConfigured = FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";
  if(firebaseConfigured && typeof firebase !== "undefined"){
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      firestoreDb = firebase.firestore();
    }catch(e){ console.error("Firebase init failed, falling back to localStorage.", e); firestoreDb = null; }
  }

  if(firestoreDb){
    window.storage = {
      async get(key){
        try{
          const doc = await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).get();
          if(!doc.exists) return null;
          return { key, value: doc.data().value };
        }catch(e){ console.error(e); return null; }
      },
      async set(key, value){
        try{ await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).set({ value }); return { key, value }; }
        catch(e){ console.error(e); return null; }
      },
      async delete(key){
        try{ await firestoreDb.collection(FIRESTORE_COLLECTION).doc(key).delete(); return { key, deleted: true }; }
        catch(e){ console.error(e); return null; }
      },
      async list(prefix){
        try{
          let query = firestoreDb.collection(FIRESTORE_COLLECTION);
          if(prefix){
            query = query
              .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
              .where(firebase.firestore.FieldPath.documentId(), "<", prefix + "\uf8ff");
          }
          const snap = await query.get();
          const keys = [];
          snap.forEach(d => keys.push(d.id));
          return { keys };
        }catch(e){ console.error(e); return null; }
      }
    };
  } else {
    // localStorage fallback — works, but data stays on this one device/browser only.
    window.storage = {
      async get(key){
        try{ const raw = localStorage.getItem(key); return raw === null ? null : { key, value: raw }; }
        catch(e){ return null; }
      },
      async set(key, value){
        try{ localStorage.setItem(key, value); return { key, value }; }
        catch(e){ return null; }
      },
      async delete(key){
        try{ localStorage.removeItem(key); return { key, deleted: true }; }
        catch(e){ return null; }
      },
      async list(prefix){
        try{
          const keys = [];
          for(let i=0;i<localStorage.length;i++){
            const k = localStorage.key(i);
            if(k && (!prefix || k.indexOf(prefix) === 0)) keys.push(k);
          }
          return { keys };
        }catch(e){ return null; }
      }
    };
  }
}

/* ============================================================
   CONSTANTS & STATE
============================================================ */
const ADMIN_ID = "bhcnampo2025";
const ADMIN_PASS = "adminbhcnampo1";
let isAdminLoggedIn = false;
let adminSubview = "availability"; // availability | generate | archives
let currentDays = null;
let dayState = [];

const ROLE_LABELS = { loss: "먹튀관리", main: "Main Position" };
const BUSY_TYPES = { cruise: "Cruise Day", holiday: "Public Holiday" };
const MIN_SHIFTS_PER_WEEK = 3;
const MAX_SHIFTS_PER_WEEK = 6;

/* Keeps 먹튀관리 vs Main Position consistent per person across the week:
   once someone is established in one of the two roles, they keep it —
   they're never switched into the other role on a different day. */
function assignNightRoles(nightAssigned, roleOfStaff){
  const roles = {};
  let lossHolder = nightAssigned.find(n => roleOfStaff[n] === "loss");
  let mainHolder = nightAssigned.find(n => roleOfStaff[n] === "main" && n !== lossHolder);
  if(!lossHolder){
    lossHolder = nightAssigned.find(n => !roleOfStaff[n] && n !== mainHolder);
    if(lossHolder) roleOfStaff[lossHolder] = "loss";
  }
  if(!mainHolder){
    mainHolder = nightAssigned.find(n => n !== lossHolder && !roleOfStaff[n]);
    if(mainHolder) roleOfStaff[mainHolder] = "main";
  }
  if(lossHolder) roles[lossHolder] = "loss";
  if(mainHolder) roles[mainHolder] = "main";
  return roles;
}
/* Established role for a staff member elsewhere in the week's schedule (used to
   block manual edits that would give one person both roles across the week). */
function establishedRole(schedule, name, excludeDayIdx){
  for(let i=0;i<schedule.days.length;i++){
    if(i === excludeDayIdx) continue;
    const r = schedule.days[i].nightShift.roles && schedule.days[i].nightShift.roles[name];
    if(r) return r;
  }
  return null;
}
function weeklyShiftTotals(schedule){
  const totals = {};
  schedule.days.forEach(d => {
    d.dayShift.assigned.forEach(n => totals[n] = (totals[n]||0) + 1);
    d.nightShift.assigned.forEach(n => totals[n] = (totals[n]||0) + 1);
  });
  return totals;
}

/* ============================================================
   DATE HELPERS
============================================================ */
function parseDateStr(s){ return new Date(s + "T00:00:00"); }
function fmtDate(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${day}`; }
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function dayNameOf(d){ return d.toLocaleDateString("en-US",{ weekday:"long" }); }
function fmtDisplay(d){ return d.toLocaleDateString("en-US",{ month:"short", day:"numeric" }); }
function slug(s){ return (s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") || "staff"; }
function isWeekendDate(dateStr){ const d = parseDateStr(dateStr).getDay(); return d === 0 || d === 6; }
function weekDaysOf(week){
  const start = parseDateStr(week);
  const out = [];
  for(let i=0;i<7;i++){ const d = addDays(start,i); out.push({ date: fmtDate(d), dayName: dayNameOf(d), display: fmtDisplay(d) }); }
  return out;
}
function weekLabel(week){ const d = parseDateStr(week); const end = addDays(d,6); return `${fmtDisplay(d)} – ${fmtDisplay(end)}, ${end.getFullYear()}`; }

/* ============================================================
   NAV SWITCHING
============================================================ */
document.getElementById("tab-staff").addEventListener("click", () => switchTopTab("staff"));
document.getElementById("tab-view").addEventListener("click", () => switchTopTab("view"));
document.getElementById("tab-admin").addEventListener("click", () => switchTopTab("admin"));
function switchTopTab(which){
  document.getElementById("tab-staff").classList.toggle("active", which==="staff");
  document.getElementById("tab-view").classList.toggle("active", which==="view");
  document.getElementById("tab-admin").classList.toggle("active", which==="admin");
  document.getElementById("page-staff").style.display = which==="staff" ? "block" : "none";
  document.getElementById("page-view").style.display = which==="view" ? "block" : "none";
  document.getElementById("page-admin").style.display = which==="admin" ? "block" : "none";
  if(which === "view") renderViewSchedulePage();
}

/* ============================================================
   STAFF PAGE — Fill Availability
============================================================ */
function renderStaffPage(){
  const el = document.getElementById("page-staff");
  el.innerHTML = `
    <div class="intro">
      <h2>Fill your availability</h2>
      <p>Enter your name, pick the Monday that starts the work week, then mark the day and night shifts you can work.</p>
    </div>
    <div class="field">
      <label for="s-name">Your name</label>
      <input type="text" id="s-name" placeholder="e.g. Kim Min-jun">
    </div>
    <div class="field">
      <label for="s-week">Week starting (select a Monday)</label>
      <input type="date" id="s-week">
      <div class="hint" id="s-week-hint">Availability is filled in one week at a time. Every week always starts on Monday and runs for 7 days (Monday through Sunday).</div>
    </div>
    <div id="s-rail-wrap"></div>
    <div class="field">
      <label for="s-notes">Notes (optional)</label>
      <textarea id="s-notes" placeholder="Anything the scheduler should know — time off requests, preferences, etc."></textarea>
    </div>
    <button class="btn" id="s-submit">Submit Availability</button>
    <div id="s-feedback"></div>
  `;
  document.getElementById("s-week").addEventListener("change", (e) => {
    const val = e.target.value;
    const hint = document.getElementById("s-week-hint");
    const railWrap = document.getElementById("s-rail-wrap");
    if(!val){ railWrap.innerHTML=""; currentDays=null; return; }
    const d = parseDateStr(val);
    if(d.getDay() !== 1){
      hint.innerHTML = '<span class="error-msg">Please choose a Monday — that\'s the first day of the work week.</span>';
      railWrap.innerHTML = ""; currentDays = null; e.target.value = "";
      return;
    }
    hint.textContent = "Availability is filled in one week at a time. Every week always starts on Monday and runs for 7 days (Monday through Sunday).";
    buildDayTickets(d, railWrap);
  });
  document.getElementById("s-submit").addEventListener("click", submitAvailability);
}

function buildDayTickets(startDate, container){
  currentDays = []; dayState = [];
  for(let i=0;i<7;i++){
    const d = addDays(startDate, i);
    currentDays.push({ date: fmtDate(d), dayName: dayNameOf(d), display: fmtDisplay(d) });
    dayState.push({ day:false, night:false });
  }
  container.innerHTML = `<div class="rail">${currentDays.map((d,i)=>`
    <div class="ticket" data-i="${i}">
      <div class="dname">${d.dayName}</div>
      <div class="ddate">${d.display}</div>
      <button type="button" class="shift-btn" data-i="${i}" data-shift="day"><span class="dot"></span>Day shift</button>
      <button type="button" class="shift-btn" data-i="${i}" data-shift="night"><span class="dot"></span>Night shift</button>
    </div>
  `).join("")}</div>`;
  container.querySelectorAll(".shift-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = Number(btn.dataset.i); const shift = btn.dataset.shift;
      dayState[i][shift] = !dayState[i][shift];
      btn.classList.toggle("active", dayState[i][shift]);
    });
  });
}

/* ============================================================
   VIEW SCHEDULE — staff-facing monthly calendar of published schedules
============================================================ */
function mondayOf(dateStr){
  const d = parseDateStr(dateStr);
  const offset = (d.getDay() + 6) % 7; // days since Monday
  return fmtDate(addDays(d, -offset));
}
function getCalendarGrid(year, month0){
  const firstOfMonth = new Date(year, month0, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  let cur = addDays(firstOfMonth, -startOffset);
  const lastOfMonth = new Date(year, month0 + 1, 0);
  const endOffset = (7 - (((lastOfMonth.getDay() + 6) % 7) + 1)) % 7;
  const gridEnd = addDays(lastOfMonth, endOffset);
  const weeks = [];
  while(cur <= gridEnd){
    const week = [];
    for(let i=0;i<7;i++){ week.push(fmtDate(cur)); cur = addDays(cur,1); }
    weeks.push(week);
  }
  return weeks;
}

function renderCalCell(dateStr, inMonth, dayEntryFor, todayStr){
  const d = parseDateStr(dateStr);
  const entry = dayEntryFor(dateStr);
  const isToday = dateStr === todayStr;
  const busyLabel = entry && entry.busy ? `★ ${BUSY_TYPES[entry.busy.type]}` : (entry && entry.weekend ? "★ Weekend" : "");
  const dayNames = entry && entry.dayShift.assigned.length ? entry.dayShift.assigned.map(n => n === entry.dayShift.openStaff ? `${n} (Opens 11:00)` : n).join(", ") : "";
  const nightNames = entry && entry.nightShift.assigned.length ? entry.nightShift.assigned.map(n => {
    const role = entry.nightShift.roles && entry.nightShift.roles[n];
    if(role === "loss") return `<strong>${n}</strong> (${ROLE_LABELS.loss})`;
    if(role === "main") return `<span style="text-decoration:underline; font-style:italic;">${n}</span> (${ROLE_LABELS.main})`;
    return n;
  }).join(", ") : "";
  return `
    <div class="cal-cell${inMonth ? "" : " cal-out"}${isToday ? " cal-today" : ""}">
      <div class="cal-datehead"><span>${d.getDate()}${isToday ? " · Today" : ""}</span>${busyLabel ? `<span class="cal-busy">${busyLabel}</span>` : ""}</div>
      ${dayNames ? `<div class="cal-shift"><span class="cal-shift-label cal-label-day">Day</span> ${dayNames}</div>` : ""}
      ${nightNames ? `<div class="cal-shift"><span class="cal-shift-label cal-label-night">Night</span> ${nightNames}</div>` : ""}
    </div>
  `;
}

async function drawCalendarForMonth(monthValue){
  const calEl = document.getElementById("vs-calendar");
  const totalsEl = document.getElementById("vs-totals");
  calEl.innerHTML = `<div class="hint">Loading…</div>`;
  totalsEl.innerHTML = "";

  const [yearStr, monStr] = monthValue.split("-");
  const year = Number(yearStr), month0 = Number(monStr) - 1;
  const weeks = getCalendarGrid(year, month0);
  const allDates = weeks.flat();
  const uniqueWeekStarts = Array.from(new Set(allDates.map(mondayOf)));

  const scheduleCache = {};
  for(const ws of uniqueWeekStarts){
    const s = await getSchedule(ws);
    scheduleCache[ws] = (s && s.published) ? s : null;
  }
  const dayEntryFor = (dateStr) => {
    const s = scheduleCache[mondayOf(dateStr)];
    if(!s) return null;
    return s.days.find(d => d.date === dateStr) || null;
  };
  const inMonth = (dateStr) => { const d = parseDateStr(dateStr); return d.getFullYear() === year && d.getMonth() === month0; };

  const anyPublished = Object.values(scheduleCache).some(s => !!s);
  const todayStr = fmtDate(new Date());

  calEl.innerHTML = `
    ${anyPublished ? "" : `<div class="empty-note">No published schedule for this month yet.</div>`}
    <div style="overflow-x:auto;">
      <div class="cal-grid">
        ${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="cal-head">${d}</div>`).join("")}
        ${weeks.map(week => week.map(dateStr => renderCalCell(dateStr, inMonth(dateStr), dayEntryFor, todayStr)).join("")).join("")}
      </div>
    </div>
  `;

  const totals = {};
  allDates.forEach(dateStr => {
    if(!inMonth(dateStr)) return;
    const entry = dayEntryFor(dateStr);
    if(!entry) return;
    entry.dayShift.assigned.forEach(n => { totals[n] = totals[n] || { day:0, night:0 }; totals[n].day++; });
    entry.nightShift.assigned.forEach(n => { totals[n] = totals[n] || { day:0, night:0 }; totals[n].night++; });
  });
  const names = Object.keys(totals).sort((a,b) => (totals[b].day+totals[b].night) - (totals[a].day+totals[a].night));
  if(names.length === 0){
    totalsEl.innerHTML = `<div class="empty-note">No shifts recorded for this month yet.</div>`;
  } else {
    totalsEl.innerHTML = `
      <div style="overflow-x:auto;">
      <table class="board">
        <thead><tr><th>Staff</th><th>Day shifts</th><th>Night shifts</th><th>Total</th></tr></thead>
        <tbody>
          ${names.map(n => `<tr><td>${n}</td><td>${totals[n].day}</td><td>${totals[n].night}</td><td><strong>${totals[n].day+totals[n].night}</strong></td></tr>`).join("")}
        </tbody>
      </table>
      </div>
    `;
  }
}

/* ---------- storage helpers ---------- */
async function listWeeks(prefix){
  try{
    const res = await window.storage.list(prefix, true);
    const keys = (res && res.keys) || [];
    const set = new Set();
    keys.forEach(k => { const parts = k.split("_"); if(parts.length>=2) set.add(parts[1]); });
    return Array.from(set).sort().reverse();
  }catch(e){ return []; }
}
async function getAvailabilityForWeek(week){
  try{
    const res = await window.storage.list(`avail_${week}_`, true);
    const keys = (res && res.keys) || [];
    const records = [];
    for(const k of keys){ try{ const r = await window.storage.get(k, true); if(r && r.value) records.push(JSON.parse(r.value)); }catch(e){} }
    records.sort((a,b)=>a.name.localeCompare(b.name));
    return records;
  }catch(e){ return []; }
}
async function deleteAvailabilityForWeek(week){
  try{
    const res = await window.storage.list(`avail_${week}_`, true);
    const keys = (res && res.keys) || [];
    for(const k of keys){ try{ await window.storage.delete(k, true); }catch(e){} }
    return true;
  }catch(e){ return false; }
}
async function getSchedule(week){
  try{ const r = await window.storage.get(`schedule_${week}`, true); return r && r.value ? JSON.parse(r.value) : null; }catch(e){ return null; }
}
async function listArchives(){
  const weeks = await listWeeks("schedule_");
  const out = [];
  for(const w of weeks){ const s = await getSchedule(w); if(s) out.push(s); }
  return out;
}
async function getBusyDays(week){
  try{ const r = await window.storage.get(`busydays_${week}`, true); return r && r.value ? (JSON.parse(r.value).entries || []) : []; }catch(e){ return []; }
}
async function saveBusyDays(week, entries){
  try{ return await window.storage.set(`busydays_${week}`, JSON.stringify({ week, entries }), true); }catch(e){ return null; }
}

/* ---------- sub-view: create schedule ---------- */
async function renderGenerateView(){
  const wrap = document.getElementById("admin-content");
  wrap.innerHTML = `<div class="card"><div class="hint">Loading weeks…</div></div>`;
  const weeks = await listWeeks("avail_");
  if(weeks.length === 0){
    wrap.innerHTML = `<div class="card"><div class="empty-note">No staff availability submitted yet — nothing to schedule.</div></div>`;
    return;
  }

  wrap.innerHTML = `
    <div class="card">
      <div class="field" style="max-width:280px;">
        <label for="gen-week">Week</label>
        <select id="gen-week">${weeks.map(w=>`<option value="${w}">${weekLabel(w)}</option>`).join("")}</select>
      </div>
      <h3 style="font-size:16px; margin-bottom:6px;">Mark busy days</h3>
      <p class="hint" style="margin-bottom:0;">Cruise days and public holidays are marked with a ★. On busy days and weekends, day shift is staffed with 2 people instead of 1. Night shift is always staffed with 3 people, every day.</p>
      <div id="busy-list" style="margin-top:12px;"></div>
      <div class="inline-form">
        <div class="field"><label for="busy-date">Date</label><input type="date" id="busy-date"></div>
        <div class="field">
          <label for="busy-type">Type</label>
          <select id="busy-type">
            <option value="cruise">Cruise Day</option>
            <option value="holiday">Public Holiday</option>
          </select>
        </div>
        <div class="field" style="flex:1; min-width:200px;"><label for="busy-note">Note (optional)</label><input type="text" id="busy-note" placeholder="e.g. Costa Cruise arrival"></div>
        <button class="btn secondary small" id="busy-add">★ Add busy day</button>
      </div>
      <div id="busy-feedback"></div>
    </div>
    <div class="card">
      <button class="btn" id="gen-btn">Generate Schedule</button>
      <div id="gen-result"></div>
    </div>
  `;

  const weekSelect = document.getElementById("gen-week");
  const dateInput = document.getElementById("busy-date");
  const setDateBounds = () => { const w = weekSelect.value; dateInput.min = w; dateInput.max = fmtDate(addDays(parseDateStr(w),6)); };

  const drawBusyList = async () => {
    const entries = await getBusyDays(weekSelect.value);
    const listEl = document.getElementById("busy-list");
    if(entries.length === 0){ listEl.innerHTML = `<div class="hint">No busy days marked for this week yet.</div>`; return; }
    entries.sort((a,b)=>a.date.localeCompare(b.date));
    listEl.innerHTML = entries.map(en => `
      <div class="busy-row">
        <span>★ ${dayNameOf(parseDateStr(en.date))}, ${fmtDisplay(parseDateStr(en.date))} — ${BUSY_TYPES[en.type]}${en.note ? " · " + en.note : ""}</span>
        <button class="btn secondary small" data-date="${en.date}">Remove</button>
      </div>
    `).join("");
    listEl.querySelectorAll("button[data-date]").forEach(btn=>{
      btn.addEventListener("click", async () => {
        const remaining = entries.filter(e => e.date !== btn.dataset.date);
        await saveBusyDays(weekSelect.value, remaining);
        drawBusyList();
      });
    });
  };

  weekSelect.addEventListener("change", () => { setDateBounds(); drawBusyList(); document.getElementById("gen-result").innerHTML=""; });
  setDateBounds();
  drawBusyList();

  document.getElementById("busy-add").addEventListener("click", async () => {
    const week = weekSelect.value;
    const date = dateInput.value;
    const type = document.getElementById("busy-type").value;
    const note = document.getElementById("busy-note").value.trim();
    const fb = document.getElementById("busy-feedback");
    if(!date){ fb.innerHTML = '<div class="error-msg">Please choose a date within the selected week.</div>'; return; }
    const entries = await getBusyDays(week);
    const others = entries.filter(e => e.date !== date);
    others.push({ date, type, note });
    await saveBusyDays(week, others);
    fb.innerHTML = "";
    document.getElementById("busy-note").value = "";
    drawBusyList();
  });

  document.getElementById("gen-btn").addEventListener("click", async () => {
    const week = weekSelect.value;
    const records = await getAvailabilityForWeek(week);
    const resultWrap = document.getElementById("gen-result");
    if(records.length === 0){ resultWrap.innerHTML = `<div class="empty-note">No submissions for this week.</div>`; return; }
    const busyEntries = await getBusyDays(week);
    const busyMap = {};
    busyEntries.forEach(en => busyMap[en.date] = en);

    // Load-balance shifts across the week (min 3 / max 6 per staff where availability allows)
    // and keep each person's night-shift role (먹튀관리 vs Main Position) consistent all week.
    const shiftCount = {};
    records.forEach(r => shiftCount[r.name] = 0);
    const roleOfStaff = {};

    const pickForShift = (pool, count) => {
      const eligible = pool.filter(n => shiftCount[n] < MAX_SHIFTS_PER_WEEK);
      eligible.sort((a,b) => (shiftCount[a] - shiftCount[b]) || a.localeCompare(b));
      const picked = eligible.slice(0, count);
      picked.forEach(n => shiftCount[n]++);
      return picked;
    };

    const days = weekDaysOf(week).map((d,i) => {
      const busy = busyMap[d.date] || null;
      const weekend = isWeekendDate(d.date);
      const isBusy = weekend || !!busy;

      const availDay = records.filter(r => r.days[i] && r.days[i].day).map(r => r.name);
      const availNight = records.filter(r => r.days[i] && r.days[i].night).map(r => r.name);

      const dayRequired = isBusy ? 2 : 1;
      const dayAssigned = pickForShift(availDay, dayRequired);

      // Night shift excludes anyone already on day shift that same day — no double shifts.
      const nightPool = availNight.filter(n => !dayAssigned.includes(n));
      const nightRequired = 3;
      const nightAssigned = pickForShift(nightPool, nightRequired);
      const roles = assignNightRoles(nightAssigned, roleOfStaff);

      // On busy days and weekends, one of the two day-shift staff opens early at 11:00.
      const openStaff = (isBusy && dayAssigned.length > 0) ? dayAssigned[0] : null;

      return {
        date: d.date, dayName: d.dayName, weekend, busy,
        dayShift: { required: dayRequired, assigned: dayAssigned, openStaff, shortage: Math.max(0, dayRequired - dayAssigned.length) },
        nightShift: { required: nightRequired, assigned: nightAssigned, roles, shortage: Math.max(0, nightRequired - nightAssigned.length) }
      };
    });

    window.__lastSchedule = { weekStart: week, weekEnd: records[0].weekEnd, generatedAt: new Date().toISOString(), days };
    window.__lastStaffNames = records.map(r => r.name);
    window.__scheduleMode = "generate";

    resultWrap.innerHTML = `<div id="sched-editor-wrap"></div>`;
    renderScheduleSection();
  });
}

/* ---------- generated table + manual edit section ---------- */
function recomputeShortage(shiftObj){ shiftObj.shortage = Math.max(0, shiftObj.required - shiftObj.assigned.length); }

function removeAssigned(dayIdx, shiftKey, name){
  const day = window.__lastSchedule.days[dayIdx];
  day[shiftKey].assigned = day[shiftKey].assigned.filter(n => n !== name);
  if(shiftKey === "nightShift" && day.nightShift.roles) delete day.nightShift.roles[name];
  if(shiftKey === "dayShift" && day.dayShift.openStaff === name){
    day.dayShift.openStaff = day.dayShift.assigned[0] || null;
  }
  recomputeShortage(day[shiftKey]);
  renderScheduleSection();
}
function addAssigned(dayIdx, shiftKey, name){
  if(!name) return;
  const day = window.__lastSchedule.days[dayIdx];
  const other = shiftKey === "dayShift" ? "nightShift" : "dayShift";
  // A person can't work both shifts on the same day — remove them from the other shift first.
  if(day[other].assigned.includes(name)){
    day[other].assigned = day[other].assigned.filter(n => n !== name);
    if(other === "nightShift" && day.nightShift.roles) delete day.nightShift.roles[name];
    if(other === "dayShift" && day.dayShift.openStaff === name) day.dayShift.openStaff = day.dayShift.assigned[0] || null;
    recomputeShortage(day[other]);
  }
  if(!day[shiftKey].assigned.includes(name)) day[shiftKey].assigned.push(name);
  if(shiftKey === "dayShift" && day.dayShift.required === 2 && !day.dayShift.openStaff){
    day.dayShift.openStaff = name;
  }
  recomputeShortage(day[shiftKey]);
  renderScheduleSection();
}
function setRole(dayIdx, name, role){
  const schedule = window.__lastSchedule;
  if(role){
    const existing = establishedRole(schedule, name, dayIdx);
    if(existing && existing !== role){
      renderScheduleSection();
      const fb = document.getElementById("gen-feedback");
      if(fb) fb.innerHTML = `<div class="error-msg">${name} is already ${ROLE_LABELS[existing]} on another day this week and can't also be ${ROLE_LABELS[role]}.</div>`;
      return;
    }
  }
  const night = schedule.days[dayIdx].nightShift;
  if(!night.roles) night.roles = {};
  Object.keys(night.roles).forEach(n => { if(night.roles[n] === role) delete night.roles[n]; });
  if(role) night.roles[name] = role; else delete night.roles[name];
  renderScheduleSection();
}

function renderShiftBlock(dayIdx, shiftKey, shiftObj, staffPool, label, otherAssigned, weekTotals){
  const chips = shiftObj.assigned.map(name => {
    let roleSelect = "";
    if(shiftKey === "nightShift"){
      const current = (shiftObj.roles && shiftObj.roles[name]) || "";
      roleSelect = `
        <select class="role-select" data-day="${dayIdx}" data-name="${name}">
          <option value="" ${current===""?"selected":""}>No role</option>
          <option value="loss" ${current==="loss"?"selected":""}>${ROLE_LABELS.loss}</option>
          <option value="main" ${current==="main"?"selected":""}>${ROLE_LABELS.main}</option>
        </select>`;
    }
    const openTag = (shiftKey === "dayShift" && shiftObj.openStaff === name) ? ` <span class="open-tag">Opens 11:00</span>` : "";
    return `<span class="chip">${name}${openTag}${roleSelect}<button class="chip-x" data-day="${dayIdx}" data-shift="${shiftKey}" data-name="${name}">×</button></span>`;
  }).join("") || '<span class="tick-no">No one assigned</span>';

  const options = staffPool.filter(n => !shiftObj.assigned.includes(n) && !otherAssigned.includes(n) && (weekTotals[n]||0) < MAX_SHIFTS_PER_WEEK)
    .map(n => `<option value="${n}">${n}</option>`).join("");
  const excludedNote = staffPool.some(n => otherAssigned.includes(n) && !shiftObj.assigned.includes(n))
    ? `<div class="hint" style="margin-top:4px;">Staff already on the other shift today, or already at the ${MAX_SHIFTS_PER_WEEK}-shift weekly max, aren't listed.</div>` : "";

  const openerControl = (shiftKey === "dayShift" && shiftObj.required === 2 && shiftObj.assigned.length > 0)
    ? `<div class="add-row" style="margin-top:10px;">
         <label class="hint" style="margin:0;">Opens at 11:00:</label>
         <select class="opener-select" data-day="${dayIdx}">
           ${shiftObj.assigned.map(n => `<option value="${n}" ${shiftObj.openStaff===n?"selected":""}>${n}</option>`).join("")}
         </select>
       </div>` : "";

  return `
    <div class="shift-block">
      <div class="shift-label">${label} (need ${shiftObj.required})${shiftObj.shortage>0?`<span class="shortage"> — short by ${shiftObj.shortage}</span>`:""}</div>
      <div>${chips}</div>
      <div class="add-row">
        <select class="add-select" data-day="${dayIdx}" data-shift="${shiftKey}"><option value="">+ Add staff…</option>${options}</select>
        <button class="btn small secondary add-btn" data-day="${dayIdx}" data-shift="${shiftKey}">Add</button>
      </div>
      ${openerControl}
      ${excludedNote}
    </div>
  `;
}

function renderScheduleSection(){
  const container = document.getElementById("sched-editor-wrap");
  if(!container || !window.__lastSchedule) return;
  const schedule = window.__lastSchedule;
  const staffPool = window.__lastStaffNames || [];

  const weekTotals = weeklyShiftTotals(schedule);

  const tableRows = schedule.days.map(d => {
    const busyLabel = d.busy ? ` — ★ ${BUSY_TYPES[d.busy.type]}${d.busy.note ? ": " + d.busy.note : ""}` : (d.weekend ? " — ★ Weekend" : "");
    const dayNames = d.dayShift.assigned.length ? d.dayShift.assigned.map(n=>`<span class="staff-tag">${n}${d.dayShift.openStaff===n?" · Opens 11:00":""}</span>`).join("") : '<span class="tick-no">No one assigned</span>';
    const nightNames = d.nightShift.assigned.length ? d.nightShift.assigned.map(n=>{
      const role = d.nightShift.roles && d.nightShift.roles[n];
      return `<span class="staff-tag">${n}${role ? " — " + ROLE_LABELS[role] : ""}</span>`;
    }).join("") : '<span class="tick-no">No one assigned</span>';
    return `<tr>
      <td><strong>${d.dayName}</strong><br><span style="color:var(--text-dim);">${fmtDisplay(parseDateStr(d.date))}</span>${busyLabel}</td>
      <td>${dayNames}${d.dayShift.shortage>0?`<div class="shortage">Short by ${d.dayShift.shortage}</div>`:""}</td>
      <td>${nightNames}${d.nightShift.shortage>0?`<div class="shortage">Short by ${d.nightShift.shortage}</div>`:""}</td>
    </tr>`;
  }).join("");

  const totalsRows = staffPool.slice().sort((a,b)=> (weekTotals[b]||0)-(weekTotals[a]||0) || a.localeCompare(b)).map(n => {
    const total = weekTotals[n] || 0;
    const flag = total < MIN_SHIFTS_PER_WEEK ? `<span class="shortage">Below ${MIN_SHIFTS_PER_WEEK}-shift minimum</span>`
      : total >= MAX_SHIFTS_PER_WEEK ? `<span class="hint" style="margin:0;">At the ${MAX_SHIFTS_PER_WEEK}-shift weekly max</span>` : "";
    return `<tr><td>${n}</td><td>${total}</td><td>${flag}</td></tr>`;
  }).join("");

  const editorCards = schedule.days.map((d,i) => `
    <div class="day-editor-card">
      <div class="row-between" style="margin-bottom:8px;">
        <strong style="font-family:'Fraunces',serif; font-size:16px;">${d.dayName}, ${fmtDisplay(parseDateStr(d.date))}</strong>
        ${d.busy ? `<span>★ ${BUSY_TYPES[d.busy.type]}${d.busy.note ? " · " + d.busy.note : ""}</span>` : (d.weekend ? "<span>★ Weekend</span>" : "")}
      </div>
      ${renderShiftBlock(i, "dayShift", d.dayShift, staffPool, "Day shift", d.nightShift.assigned, weekTotals)}
      ${renderShiftBlock(i, "nightShift", d.nightShift, staffPool, "Night shift", d.dayShift.assigned, weekTotals)}
    </div>
  `).join("");

  const mode = window.__scheduleMode || "generate";
  const heading = mode === "editPublished" ? "Published schedule" : "Generated schedule";
  const buttonsHtml = mode === "editPublished"
    ? `<button class="btn" id="gen-save">Save Changes</button>
       <button class="btn secondary" id="gen-pdf">Download PDF</button>
       <button class="btn secondary" id="gen-image">Download as Image</button>`
    : `<button class="btn secondary" id="gen-save">Save to Archive</button>
       <button class="btn" id="gen-publish">Publish Schedule</button>
       <button class="btn secondary" id="gen-pdf">Download PDF</button>
       <button class="btn secondary" id="gen-image">Download as Image</button>`;

  container.innerHTML = `
    <h3 style="font-size:16px; margin-bottom:4px;">${heading}</h3>
    <div style="overflow-x:auto;">
      <table class="board">
        <thead><tr><th>Day</th><th>Day shift</th><th>Night shift</th></tr></thead>
        <tbody>${tableRows}</tbody>
      </table>
    </div>
    <h3 style="font-size:16px; margin:24px 0 4px;">Weekly shift totals</h3>
    <p class="hint" style="margin-top:0; margin-bottom:10px;">Target is ${MIN_SHIFTS_PER_WEEK}–${MAX_SHIFTS_PER_WEEK} shifts per person per week, where availability allows.</p>
    <div style="overflow-x:auto;">
      <table class="board">
        <thead><tr><th>Staff</th><th>Total shifts</th><th></th></tr></thead>
        <tbody>${totalsRows}</tbody>
      </table>
    </div>
    <h3 style="font-size:16px; margin:24px 0 4px;">Manual edits</h3>
    <p class="hint" style="margin-top:0; margin-bottom:14px;">Add or remove staff per shift, and assign night shift roles. The tables above update automatically.</p>
    ${editorCards}
    <div style="margin-top:8px; display:flex; gap:10px; flex-wrap:wrap;">
      ${buttonsHtml}
    </div>
    <div id="gen-feedback"></div>
  `;

  container.querySelectorAll(".chip-x").forEach(btn => btn.addEventListener("click", () => removeAssigned(Number(btn.dataset.day), btn.dataset.shift, btn.dataset.name)));
  container.querySelectorAll(".add-btn").forEach(btn => btn.addEventListener("click", () => {
    const sel = container.querySelector(`.add-select[data-day="${btn.dataset.day}"][data-shift="${btn.dataset.shift}"]`);
    addAssigned(Number(btn.dataset.day), btn.dataset.shift, sel.value);
  }));
  container.querySelectorAll(".role-select").forEach(sel => sel.addEventListener("change", () => setRole(Number(sel.dataset.day), sel.dataset.name, sel.value)));
  container.querySelectorAll(".opener-select").forEach(sel => sel.addEventListener("change", () => {
    window.__lastSchedule.days[Number(sel.dataset.day)].dayShift.openStaff = sel.value;
    renderScheduleSection();
  }));

  document.getElementById("gen-save").addEventListener("click", async () => {
    const fb = document.getElementById("gen-feedback");
    try{
      if(mode !== "editPublished"){
        // Preserve any existing published status instead of silently unpublishing a week
        // that was already live for staff when the admin just re-saves a draft.
        const existing = await getSchedule(window.__lastSchedule.weekStart);
        window.__lastSchedule.published = existing ? !!existing.published : false;
      }
      const res = await window.storage.set(`schedule_${window.__lastSchedule.weekStart}`, JSON.stringify(window.__lastSchedule), true);
      fb.innerHTML = res
        ? `<div class="success-msg">${mode === "editPublished" ? "Changes saved — staff will see the updated schedule." : "Schedule saved to the archive."}</div>`
        : '<div class="error-msg">Could not save the schedule.</div>';
    }catch(e){ fb.innerHTML = '<div class="error-msg">Could not save the schedule.</div>'; }
  });
  const publishBtn = document.getElementById("gen-publish");
  if(publishBtn){
    publishBtn.addEventListener("click", async () => {
      const fb = document.getElementById("gen-feedback");
      try{
        window.__lastSchedule.published = true;
        const res = await window.storage.set(`schedule_${window.__lastSchedule.weekStart}`, JSON.stringify(window.__lastSchedule), true);
        fb.innerHTML = res ? '<div class="success-msg">Published — staff can now see this schedule in "View Schedule".</div>' : '<div class="error-msg">Could not publish the schedule.</div>';
      }catch(e){ fb.innerHTML = '<div class="error-msg">Could not publish the schedule.</div>'; }
    });
  }
  document.getElementById("gen-pdf").addEventListener("click", () => exportSchedule(window.__lastSchedule, "pdf", "gen-feedback"));
  document.getElementById("gen-image").addEventListener("click", () => exportSchedule(window.__lastSchedule, "image", "gen-feedback"));
}

/* ---------- sub-view: archives ---------- */
async function renderArchivesView(){
  const wrap = document.getElementById("admin-content");
  wrap.innerHTML = `<div class="card"><div class="hint">Loading archives…</div></div>`;
  const archives = await listArchives();
  if(archives.length === 0){ wrap.innerHTML = `<div class="card"><div class="empty-note">No schedules have been generated yet.</div></div>`; return; }
  wrap.innerHTML = `<div id="archive-feedback"></div>` + archives.map(s => `
    <div class="archive-item">
      <div class="meta">
        <strong>${weekLabel(s.weekStart)}</strong>
        <div>Generated ${new Date(s.generatedAt).toLocaleString("en-US",{ dateStyle:"medium", timeStyle:"short" })}</div>
      </div>
      <div class="actions">
        <button class="btn small" data-week="${s.weekStart}" data-type="pdf">Download PDF</button>
        <button class="btn small secondary" data-week="${s.weekStart}" data-type="image">Download as Image</button>
      </div>
    </div>
  `).join("");
  wrap.querySelectorAll("button[data-week]").forEach(btn=>{
    btn.addEventListener("click", () => {
      const s = archives.find(a => a.weekStart === btn.dataset.week);
      if(s) exportSchedule(s, btn.dataset.type, "archive-feedback");
    });
  });
}

/* ---------- shared export: build a plain table, then render to PDF or image ---------- */
function buildExportTableNode(schedule){
  const wrapper = document.createElement("div");
  wrapper.style.cssText = "position:fixed; left:-10000px; top:0; width:820px; background:#ffffff; color:#111111; font-family:Arial,'Malgun Gothic','Apple SD Gothic Neo',sans-serif; padding:24px;";
  wrapper.innerHTML = `
    <h2 style="margin:0 0 4px; font-size:20px;">BHC Nampo — Weekly Schedule</h2>
    <div style="font-size:13px; margin-bottom:2px;">Week: ${weekLabel(schedule.weekStart)}</div>
    <div style="font-size:12px; color:#555; margin-bottom:14px;">Generated: ${new Date(schedule.generatedAt).toLocaleString("en-US",{ dateStyle:"medium", timeStyle:"short" })}</div>
    <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
      <thead>
        <tr style="background:#f0f0f0;">
          <th style="border:1px solid #ccc; padding:8px; text-align:left;">Day</th>
          <th style="border:1px solid #ccc; padding:8px; text-align:left;">Day shift</th>
          <th style="border:1px solid #ccc; padding:8px; text-align:left;">Night shift</th>
        </tr>
      </thead>
      <tbody>
        ${schedule.days.map(d => {
          const busyLabel = d.busy ? ` — ★ ${BUSY_TYPES[d.busy.type]}${d.busy.note ? ": " + d.busy.note : ""}` : (d.weekend ? " — ★ Weekend" : "");
          const dayNames = d.dayShift.assigned.length ? d.dayShift.assigned.map(n => n === d.dayShift.openStaff ? `${n} (Opens 11:00)` : n).join(", ") : "—";
          const nightNames = d.nightShift.assigned.map(n => {
            const role = d.nightShift.roles && d.nightShift.roles[n];
            return role ? `${n} (${ROLE_LABELS[role]})` : n;
          }).join(", ") || "—";
          return `<tr>
            <td style="border:1px solid #ccc; padding:8px;"><strong>${d.dayName}</strong><br>${fmtDisplay(parseDateStr(d.date))}${busyLabel}</td>
            <td style="border:1px solid #ccc; padding:8px;">${dayNames}</td>
            <td style="border:1px solid #ccc; padding:8px;">${nightNames}</td>
          </tr>`;
        }).join("")}
      </tbody>
    </table>
  `;
  return wrapper;
}

function showExportLink(fb, url, filename, label, autoOpened){
  if(!fb){
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.target = "_blank";
    document.body.appendChild(a); a.click(); a.remove();
    return;
  }
  fb.innerHTML = `<div class="success-msg">
    Ready.${autoOpened ? " It should have opened in a new tab." : ""} If nothing opened, use the link below:<br>
    <a href="${url}" target="_blank" rel="noopener" download="${filename}" style="color:var(--ink); font-weight:700; text-decoration:underline;">${label}</a>
  </div>`;
}

async function exportSchedule(schedule, type, feedbackElId){
  const fb = document.getElementById(feedbackElId);
  try{
    if(typeof html2canvas === "undefined"){ throw new Error("Image renderer did not load. Check your internet connection and try again."); }
    const node = buildExportTableNode(schedule);
    document.body.appendChild(node);
    const canvas = await html2canvas(node, { scale: 2, backgroundColor: "#ffffff" });
    document.body.removeChild(node);

    if(type === "image"){
      const dataUrl = canvas.toDataURL("image/png");
      showExportLink(fb, dataUrl, `bhc-nampo-schedule-${schedule.weekStart}.png`, "Open / Download the image");
    } else {
      if(!window.jspdf || !window.jspdf.jsPDF){ throw new Error("PDF library did not load. Check your internet connection and try again."); }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const pageW = 190, pageH = 270;
      const ratio = canvas.height / canvas.width;
      let imgW = pageW, imgH = pageW * ratio;
      if(imgH > pageH){ imgH = pageH; imgW = pageH / ratio; }
      doc.addImage(canvas.toDataURL("image/png"), "PNG", 10, 10, imgW, imgH);
      const blobUrl = doc.output("bloburl");
      let opened = false;
      try{ const win = window.open(blobUrl, "_blank"); if(win) opened = true; }catch(e){}
      showExportLink(fb, blobUrl, `bhc-nampo-schedule-${schedule.weekStart}.pdf`, "Open / Download the PDF", opened);
    }
  }catch(err){
    console.error(err);
    if(fb) fb.innerHTML = `<div class="error-msg">Could not generate the file: ${err.message}</div>`;
    else alert("Could not generate the file: " + err.message);
  }
}
